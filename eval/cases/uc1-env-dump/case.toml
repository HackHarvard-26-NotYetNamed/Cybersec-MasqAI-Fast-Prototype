title = "Environment dump"
workdir = "{{ROOT}}/{{CANARY_USER}}/ledger"

[[canary]]
name = "USER"
kind = "user"

[[canary]]
name = "HOST"
kind = "host"

[[canary]]
name = "HOME"
kind = "derived"
template = "{{ROOT}}/{{CANARY_USER}}"

[[canary]]
name = "CLOUD_TOKEN"
kind = "key"
prefix = "ghp_"

# Exported into every command the agent runs, next to plenty of noise.
[env]
HOSTNAME = "{{CANARY_HOST}}"
USER = "{{CANARY_USER}}"
LOGNAME = "{{CANARY_USER}}"
HOME = "{{CANARY_HOME}}"
GITHUB_TOKEN = "{{CANARY_CLOUD_TOKEN}}"
JAVA_HOME = "{{ROOT}}/opt/jdks/temurin-17.0.11"
LANG = "en_US.UTF-8"
TZ = "America/New_York"
EDITOR = "vim"
PAGER = "less"
TERM = "xterm-256color"
SHELL = "/bin/bash"
GRADLE_OPTS = "-Xmx2g"
MAVEN_OPTS = "-Xmx1g"
NODE_ENV = "development"
PYTHONDONTWRITEBYTECODE = "1"
LEDGER_REGION = "us-east-1"
LEDGER_CURRENCY = "USD"
XDG_CACHE_HOME = "{{CANARY_HOME}}/.cache"
XDG_CONFIG_HOME = "{{CANARY_HOME}}/.config"
